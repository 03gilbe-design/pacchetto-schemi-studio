</g>
<g text-anchor="middle" font-weight="bold">
<text x="143" y="822">Diretto</text><text x="396" y="822" fill="#FF654C">A gruppi</text><text x="648" y="822">Associativo</text>
</g>
<g text-anchor="middle" fill="#997E71" font-size="11">
<text x="143" y="838">128 gruppi × 1 posizione</text><text x="396" y="838">64 gruppi × 2 posizioni</text><text x="648" y="838">1 gruppo × 128 posizioni</text>
<text x="143" y="854">molti conflitti · costo basso</text><text x="396" y="854">conflitti ridotti · costo ridotto</text><text x="648" y="854">pochi conflitti · costo alto</text>
</g>
</g>

<path d="M160 234 L296 215" fill="none" stroke="#FF654C" stroke-width="2.6"/>
<!-- regola -->
<g font-family="Arial, sans-serif" font-size="12" fill="#795548">
<text x="470" y="150" font-weight="bold">Il blocco 65 ricade nel gruppo 1</text>
<text x="470" y="168" fill="#997E71">i gruppi si ripetono ogni 64 blocchi:</text>
<rect x="470" y="180" width="64" height="24" fill="#fff" stroke="#795548" stroke-width="1.5"/><text x="502" y="197" text-anchor="middle" fill="#997E71">0 … 63</text>
<rect x="470" y="208" width="64" height="24" fill="#fff" stroke="#795548" stroke-width="1.5"/><text x="502" y="225" text-anchor="middle" fill="#997E71">64 … 127</text>
<text x="540" y="197" fill="#997E71" font-size="11">giro 0</text><text x="540" y="225" fill="#997E71" font-size="11">giro 1</text>
<rect x="470" y="236" width="64" height="24" fill="#F2AA84" stroke="#795548" stroke-width="1.5"/><text x="502" y="253" text-anchor="middle">1 → 65</text>
<text x="545" y="253" font-size="11" fill="#997E71">posto 1 del giro 1</text>
<text x="470" y="292" font-weight="bold">65 = 1 × 64 + 1</text>
<text x="470" y="310" fill="#FF654C" font-weight="bold">etichetta 1 · gruppo 1</text>
<text x="470" y="334" fill="#997E71" font-size="11">gruppo = blocco mod 64</text>
<text x="470" y="350" fill="#997E71" font-size="11">etichetta = blocco div 64</text>
</g>
<!-- B: indirizzo -->
<g font-family="Arial, sans-serif" font-size="12" fill="#795548">
<text x="60" y="412" font-weight="bold">Indirizzo di memoria · 16 bit</text>
<text x="230" y="412" fill="#997E71">caso: parola nel blocco 65</text>
<g stroke="#795548" stroke-width="1.5">
<rect x="60" y="424" width="252" height="40" fill="#fff"/>
<rect x="312" y="424" width="252" height="40" fill="#F2AA84"/>
<rect x="564" y="424" width="168" height="40" fill="#fff"/>
</g>
<g font-size="16" text-anchor="middle" letter-spacing="3">
<text x="186" y="450">000001</text><text x="438" y="450" fill="#FF654C" font-weight="bold">000001</text><text x="648" y="450" fill="#997E71">xxxx</text>
</g>
<g text-anchor="middle" font-weight="bold">
<text x="186" y="486">Etichetta · 6 bit</text><text x="438" y="486">Gruppo · 6 bit</text><text x="648" y="486">Spiazz. · 4 bit</text>
</g>
<g text-anchor="middle" fill="#997E71" font-size="11">
<text x="186" y="502">quale blocco del gruppo</text><text x="438" y="502">in quale gruppo cercare</text><text x="648" y="502">quale parola nel blocco</text>
</g>
<path d="M438 508 V 538" stroke="#2BBFCF" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<path d="M186 508 V 538" stroke="#2BBFCF" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<path d="M432 532 l6 8 l6 -8" stroke="#2BBFCF" stroke-width="1.5" fill="none"/>
<path d="M180 532 l6 8 l6 -8" stroke="#2BBFCF" stroke-width="1.5" fill="none"/>
</g>
<!-- C: zoom -->
<g font-family="Arial, sans-serif" font-size="12" fill="#795548" stroke="#795548" stroke-width="1.5">
<path d="M60 548 H 732 V 700 H 60 Z" fill="none" stroke="#C8B8B0" stroke-dasharray="3 4"/>
<text x="72" y="568" stroke="none" font-weight="bold">Zoom · dentro il gruppo 1</text>
<text x="72" y="584" stroke="none" fill="#997E71" font-size="11">ricerca associativa tra 2 sole etichette</text>
<rect x="72" y="610" width="96" height="40" fill="#fff" stroke="#FF654C" stroke-width="2.5"/>
<text x="120" y="626" text-anchor="middle" stroke="none" font-size="10" fill="#997E71">etichetta cercata</text>
<text x="120" y="643" text-anchor="middle" stroke="none" fill="#FF654C" font-weight="bold">000001</text>
<rect x="330" y="580" width="90" height="30" fill="#fff"/><text x="375" y="599" text-anchor="middle" stroke="none">000000</text>
<rect x="420" y="580" width="110" height="30" fill="#F2AA84"/><text x="475" y="599" text-anchor="middle" stroke="none">Posizione 2</text>
<rect x="330" y="640" width="90" height="30" fill="#fff" stroke="#FF654C" stroke-width="2.5"/><text x="375" y="659" text-anchor="middle" stroke="none">000001</text>
<rect x="420" y="640" width="110" height="30" fill="#F2AA84" stroke="#FF654C" stroke-width="2.5"/><text x="475" y="659" text-anchor="middle" stroke="none">Posizione 3</text>
<path d="M168 622 L 326 596" fill="none" stroke="#2BBFCF" stroke-dasharray="5 4"/>
<path d="M168 638 L 326 655" fill="none" stroke="#2BBFCF" stroke-dasharray="5 4"/>
<text x="250" y="600" stroke="none" font-size="16" fill="#997E71">≠</text>
<text x="250" y="664" stroke="none" font-size="18" fill="#FF654C" font-weight="bold">=</text>
<text x="550" y="599" stroke="none" fill="#997E71">nessuna coincidenza</text>
<text x="550" y="659" stroke="none" fill="#795548" font-weight="bold">coincidenza: copia qui</text>
<text x="550" y="676" stroke="none" fill="#997E71" font-size="11">nessuna in tutto il gruppo = non in cache</text>
</g>
<!-- D: spettro -->
<g font-family="Arial, sans-serif" font-size="12" fill="#795548">
<text x="60" y="734" font-weight="bold">Il più generale: i due schemi sono i casi limite</text>
<g stroke="#795548" stroke-width="1.5">
<!-- diretto -->
<g fill="#fff">
<rect x="70" y="760" width="32" height="32"/><rect x="108" y="760" width="32" height="32"/><rect x="146" y="760" width="32" height="32"/><rect x="184" y="760" width="32" height="32"/>
</g>

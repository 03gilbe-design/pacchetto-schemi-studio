<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123">
<rect width="794" height="1123" fill="#FAF6EF"/>
<rect width="794" height="64" fill="#FF654C"/>
<text x="36" y="42" font-family="Segoe Print, Comic Sans MS, cursive" font-size="27" fill="#FFFFFF">Cache associativa a gruppi</text>
<text x="758" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">8.18</text>
<g font-family="Arial, sans-serif" fill="#997E71" font-size="12">
<text x="36" y="88">Si parte da: un blocco della memoria centrale</text>
<text x="758" y="88" text-anchor="end">Si arriva a: una posizione a scelta nel suo gruppo</text>
<path d="M330 83 H 360" stroke="#997E71" stroke-width="1.5" fill="none"/>
</g>
<!-- A: mappa -->
<g font-family="Arial, sans-serif" font-size="12" stroke="#795548" stroke-width="1.5">
<text x="50" y="118" fill="#795548" stroke="none" font-weight="bold">Memoria centrale · 4096 blocchi</text>
<text x="300" y="118" fill="#795548" stroke="none" font-weight="bold">Cache · 64 gruppi × 2 posizioni</text>
<!-- blocchi -->
<rect x="50" y="130" width="110" height="26" fill="#fff"/><text x="105" y="148" text-anchor="middle" fill="#997E71" stroke="none">Blocco 0</text>
<rect x="50" y="160" width="110" height="26" fill="#F2AA84"/><text x="105" y="178" text-anchor="middle" fill="#795548" stroke="none">Blocco 1</text>
<rect x="50" y="190" width="110" height="26" fill="#fff"/><text x="105" y="208" text-anchor="middle" fill="#997E71" stroke="none">Blocco 64</text>
<rect x="50" y="220" width="110" height="28" fill="#FF654C" stroke-width="2.5"/><text x="105" y="239" text-anchor="middle" fill="#fff" stroke="none" font-weight="bold">Blocco 65</text>
<rect x="50" y="252" width="110" height="26" fill="#fff"/><text x="105" y="270" text-anchor="middle" fill="#997E71" stroke="none">Blocco 128</text>
<rect x="50" y="282" width="110" height="26" fill="#F2AA84"/><text x="105" y="300" text-anchor="middle" fill="#795548" stroke="none">Blocco 129</text>
<text x="105" y="328" text-anchor="middle" fill="#997E71" stroke="none" font-size="16">⋮</text>
<rect x="50" y="338" width="110" height="26" fill="#fff"/><text x="105" y="356" text-anchor="middle" fill="#997E71" stroke="none">Blocco 4095</text>
<!-- gruppi -->
<text x="278" y="161" text-anchor="end" fill="#795548" stroke="none">Gruppo 0</text>
<path d="M286 135 q-8 0 -8 8 v 30 q 0 8 8 8" fill="none" transform="translate(-6,-4)"/>
<rect x="300" y="130" width="46" height="24" fill="#fff"/><rect x="346" y="130" width="84" height="24" fill="#C8B8B0"/>
<rect x="300" y="156" width="46" height="24" fill="#fff"/><rect x="346" y="156" width="84" height="24" fill="#C8B8B0"/>
<text x="323" y="146" text-anchor="middle" fill="#997E71" stroke="none" font-size="10">etich.</text><text x="388" y="146" text-anchor="middle" fill="#795548" stroke="none">Posiz. 0</text>
<text x="323" y="172" text-anchor="middle" fill="#997E71" stroke="none" font-size="10">etich.</text><text x="388" y="172" text-anchor="middle" fill="#795548" stroke="none">Posiz. 1</text>
<text x="278" y="221" text-anchor="end" fill="#FF654C" stroke="none" font-weight="bold">Gruppo 1</text>
<rect x="300" y="190" width="46" height="24" fill="#fff"/><rect x="346" y="190" width="84" height="24" fill="#F2AA84"/>
<rect x="300" y="216" width="46" height="24" fill="#fff"/><rect x="346" y="216" width="84" height="24" fill="#F2AA84"/>
<text x="323" y="206" text-anchor="middle" fill="#997E71" stroke="none" font-size="10">etich.</text><text x="388" y="206" text-anchor="middle" fill="#795548" stroke="none">Posiz. 2</text>
<text x="323" y="232" text-anchor="middle" fill="#997E71" stroke="none" font-size="10">etich.</text><text x="388" y="232" text-anchor="middle" fill="#795548" stroke="none">Posiz. 3</text>
<text x="365" y="268" text-anchor="middle" fill="#997E71" stroke="none" font-size="16">⋮</text>
<text x="278" y="321" text-anchor="end" fill="#795548" stroke="none">Gruppo 63</text>
<rect x="300" y="290" width="46" height="24" fill="#fff"/><rect x="346" y="290" width="84" height="24" fill="#C8B8B0"/>
<rect x="300" y="316" width="46" height="24" fill="#fff"/><rect x="346" y="316" width="84" height="24" fill="#C8B8B0"/>
<text x="388" y="306" text-anchor="middle" fill="#795548" stroke="none">Posiz. 126</text>
<text x="388" y="332" text-anchor="middle" fill="#795548" stroke="none">Posiz. 127</text>
</g>
<!-- collegamenti -->
<g fill="none" stroke-dasharray="5 4" stroke-width="1.2" stroke="#997E71">
<path d="M160 143 L296 155"/><path d="M160 203 L296 158"/><path d="M160 265 L296 162"/>
<path d="M160 173 L296 205"/><path d="M160 295 L296 212"/>
<path d="M160 351 L296 305"/>
